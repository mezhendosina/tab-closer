name: Build CRX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-crx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        id: tag
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing key
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::error::Add repository secret CRX_PRIVATE_KEY (base64 PEM). See README."
            exit 1
          fi
          echo "$CRX_PRIVATE_KEY" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Install crx3
        run: npm install crx3@2.0.0 --prefix "$RUNNER_TEMP/crx-tools"

      - id: pack
        name: Pack CRX and ZIP
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CRX="tabCloser-v${VERSION}.crx"
          ZIP="tabCloser-v${VERSION}.zip"
          STAGE="$RUNNER_TEMP/extension"
          mkdir -p "$STAGE/icons"
          cp manifest.json background.js settings.js \
            options.html options.css options.js \
            popup.html popup.css popup.js \
            "$STAGE/"
          cp icons/*.png "$STAGE/icons/"
          node "$RUNNER_TEMP/crx-tools/node_modules/crx3/bin/crx3.js" \
            "$STAGE" -o "$CRX" -p key.pem -z "$ZIP"
          echo "crx=$CRX" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tabCloser-v${{ steps.meta.outputs.version }}
          path: |
            tabCloser-v${{ steps.meta.outputs.version }}.crx
            tabCloser-v${{ steps.meta.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.tag.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TabCloser ${{ steps.meta.outputs.version }}
          files: |
            ${{ steps.pack.outputs.crx }}
            ${{ steps.pack.outputs.zip }}
          generate_release_notes: true
